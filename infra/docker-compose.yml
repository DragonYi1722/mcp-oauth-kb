name: mcp-oauth-kb

services:
  postgres:
    # AWS ECR public mirror of the official image. Docker Hub is often
    # unreachable from mainland China; this mirror is equivalent.
    image: public.ecr.aws/docker/library/postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-kb.json:/opt/keycloak/data/import/realm-kb.json:ro
    healthcheck:
      # kc.sh is a bash script, so bash is present in the image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/kb/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mcp-server:
    build:
      context: ../apps/mcp-server
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      KB_STORAGE_BACKEND: postgres
      # The container is a resource server; never start it with auth disabled
      # unless someone explicitly opts out.
      KB_AUTH_ENABLED: ${KB_AUTH_ENABLED:-true}
      KB_DATABASE_URL: postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@postgres:5432/${POSTGRES_DB:-kb}
      # Tokens carry iss=http://localhost:8080 (the URL the browser sees), but
      # the container resolves JWKS over the compose network.
      # Public deployments override these three with the HTTPS URLs that
      # clients and browsers actually use:
      #   KB_ISSUER=https://mcp.example.com/realms/kb
      #   KB_RESOURCE_URL=https://mcp.example.com/mcp
      # The JWKS URI stays on the compose network.
      KB_JWKS_URI: ${KB_JWKS_URI:-http://keycloak:8080/realms/kb/protocol/openid-connect/certs}
      KB_ISSUER: ${KB_ISSUER:-http://localhost:8080/realms/kb}
      KB_RESOURCE_URL: ${KB_RESOURCE_URL:-http://localhost:8000/mcp}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  caddy:
    image: public.ecr.aws/docker/library/caddy:2
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Override with host.docker.internal:8000 to test TLS against a server
      # running outside Docker.
      MCP_UPSTREAM: ${MCP_UPSTREAM:-mcp-server:8000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
