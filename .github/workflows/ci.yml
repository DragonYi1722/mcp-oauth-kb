name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/mcp-server/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Unit and security tests
        run: pytest -m "not integration" --cov=kb_mcp --cov-report=term-missing --cov-fail-under=70
      - name: Dependency audit
        run: pip-audit
        continue-on-error: true

  clients:
    name: Python and TypeScript clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/py-client/pyproject.toml
      - name: Install Python client
        run: pip install -e apps/py-client ruff mypy
      - name: Lint Python client
        run: |
          ruff check apps/py-client/src
          ruff format --check apps/py-client/src
      - name: Type check Python client
        run: mypy apps/py-client/src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ts-client/package-lock.json
      - name: Install and build TypeScript client
        working-directory: apps/ts-client
        run: |
          npm ci
          npm run build

  docker:
    name: Build server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kb-mcp:ci apps/mcp-server
      - name: Container smoke test
        run: |
          docker run -d --name kb-mcp-ci -p 8000:8000 \
            -e KB_STORAGE_BACKEND=memory \
            -e KB_AUTH_ENABLED=false \
            kb-mcp:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs kb-mcp-ci
            exit 1
          fi
      - name: Remove container
        if: always()
        run: docker rm -f kb-mcp-ci || true

  integration:
    name: Keycloak + MCP server end-to-end
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/mcp-server/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ts-client/package-lock.json
      - name: Install Python packages
        run: |
          pip install -e apps/mcp-server
          pip install -e apps/py-client
      - name: Build TypeScript client
        working-directory: apps/ts-client
        run: |
          npm ci
          npm run build
      - name: Start PostgreSQL and Keycloak
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 300 postgres keycloak
      - name: Wait for the realm
        run: python scripts/check_keycloak.py --wait 180
      - name: Seed real subjects
        run: python scripts/bootstrap_seed.py --reset
      - name: Start MCP server
        working-directory: apps/mcp-server
        run: |
          KB_AUTH_ENABLED=true KB_STORAGE_BACKEND=postgres KB_HOST=127.0.0.1 \
            nohup python -m kb_mcp.server > /tmp/kb-mcp.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 1
          done
          cat /tmp/kb-mcp.log
          exit 1
      - name: Auth smoke test
        run: python scripts/smoke_auth.py
      - name: Client OAuth acceptance
        run: python scripts/verify_clients.py
      - name: Security tests against the live stack
        working-directory: apps/mcp-server
        run: pytest -m "security and integration" -q
      - name: Server log on failure
        if: failure()
        run: cat /tmp/kb-mcp.log || true
      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
