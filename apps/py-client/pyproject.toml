[project]
name = "kb-client"
version = "0.1.0"
description = "Python OAuth 2.1 client for the knowledge base MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx2>=2.16",
]

[project.scripts]
kb-client = "kb_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_client"]
